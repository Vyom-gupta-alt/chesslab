[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ttvision"
version = "0.1.0"
description = "Table tennis video analysis: rally clipping, stroke classification, pose breakdown, pro comparison"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
pose = ["mediapipe>=0.10.14"]
torch = ["torch>=2.2"]
yolo = ["ultralytics>=8.3"]
dev = ["pytest>=8"]

[project.scripts]
ttvision = "ttvision.cli:main"

[tool.setuptools.packages.find]
include = ["ttvision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
